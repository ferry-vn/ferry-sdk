name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Versions are in lockstep
        run: npm run version:check

      - name: Generated spec + types are up to date
        run: npm run generate:check

      - name: Lint + format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke — SDK bundles, CLI help, MCP stdio + HTTP security
        run: npm run smoke:sdk && npm run smoke:cli && npm run smoke:mcp

      - name: Package checks (publint, attw, pack + install)
        if: matrix.node == 24
        run: npm run pack:check

      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  sdk-oldest-node:
    name: SDK runtime on Node 20
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke the built SDK (no dev toolchain needed)
        run: node scripts/smoke-sdk.mjs

  cross-os:
    name: CLI + MCP on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:cli
